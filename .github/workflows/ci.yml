name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (strict)
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Native bundle compiles
        run: npx expo export --platform ios --output-dir /tmp/rc-export
