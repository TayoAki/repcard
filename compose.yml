# Local dev database. `npm run db:up` / `npm run db:down`.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432" # loopback only - never expose dev creds to the LAN
    environment:
      POSTGRES_DB: repcard
      POSTGRES_USER: repcard
      POSTGRES_PASSWORD: repcard
    volumes:
      - repcard-pg:/var/lib/postgresql/data
volumes:
  repcard-pg:
